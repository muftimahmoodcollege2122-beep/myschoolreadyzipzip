name: MySchool App — CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── Lint & Type-check ─────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run lint --workspaces --if-present
      - run: npm run type-check --workspaces --if-present

  # ── Unit Tests ────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: myschoolapp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/myschoolapp_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test-jwt-secret-minimum-32-chars-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma
        working-directory: ./
      - run: npm run test --workspace=apps/api -- --coverage --passWithNoTests
      - uses: codecov/codecov-action@v3

  # ── Security Scan ─────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          exit-code: 1
          severity: CRITICAL

  # ── Build & Push Docker Images ────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    outputs:
      api-image: ${{ steps.build-api.outputs.image }}
      web-image: ${{ steps.build-web.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push API
        id: build-api
        run: |
          docker build -f apps/api/Dockerfile -t $ECR_REGISTRY/myschoolapp-api:$IMAGE_TAG .
          docker build -f apps/api/Dockerfile -t $ECR_REGISTRY/myschoolapp-api:latest .
          docker push $ECR_REGISTRY/myschoolapp-api:$IMAGE_TAG
          docker push $ECR_REGISTRY/myschoolapp-api:latest
          echo "image=$ECR_REGISTRY/myschoolapp-api:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build & Push Web
        id: build-web
        run: |
          docker build -f apps/web/Dockerfile -t $ECR_REGISTRY/myschoolapp-web:$IMAGE_TAG .
          docker push $ECR_REGISTRY/myschoolapp-web:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/myschoolapp-web:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ── Deploy to EKS ─────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name myschoolapp-cluster --region ${{ env.AWS_REGION }}

      - name: Run DB Migrations
        run: |
          kubectl run migrations --image=${{ needs.build.outputs.api-image }}             --restart=Never --rm -i             --env="DATABASE_URL=${{ secrets.DATABASE_URL }}"             -- npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Deploy API (canary 5% → 100%)
        run: |
          sed -i "s|ECR_REGISTRY/myschoolapp-api:IMAGE_TAG|${{ needs.build.outputs.api-image }}|g"             infrastructure/kubernetes/base/api-deployment.yaml
          kubectl apply -f infrastructure/kubernetes/base/api-deployment.yaml
          kubectl rollout status deployment/myschoolapp-api --timeout=5m

      - name: Deploy Web
        run: |
          sed -i "s|ECR_REGISTRY/myschoolapp-web:IMAGE_TAG|${{ needs.build.outputs.web-image }}|g"             infrastructure/kubernetes/base/web-deployment.yaml
          kubectl apply -f infrastructure/kubernetes/base/web-deployment.yaml
          kubectl rollout status deployment/myschoolapp-web --timeout=5m

      - name: Health Check
        run: |
          sleep 15
          curl -f https://api.myschoolapp.pk/health || (kubectl rollout undo deployment/myschoolapp-api && exit 1)

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: '{"text":"✅ MySchool App deployed successfully — ${{ github.sha }}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: '{"text":"🚨 MySchool App deployment FAILED — ${{ github.sha }}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
