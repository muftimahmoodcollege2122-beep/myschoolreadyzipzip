# ======================================================================
#  EduOS Multi-Portal Nginx Config
#  Ports: API=4000  Marketing=3000  Admin=3001  Teacher=3002
#         Student=3003  Parent=3004
#  Subdomains: admin.*  teach.*  learn.*  parent.*  (slug).*
# ======================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time ut=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance ────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75;
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;
    client_max_body_size 50m;

    # ── Rate Limiting ──────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api:10m     rate=60r/m;
    limit_req_zone  $binary_remote_addr zone=login:10m   rate=10r/m;
    limit_req_zone  $binary_remote_addr zone=general:10m rate=120r/m;

    # ── SSL Settings ───────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security Headers ───────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # ── Upstreams ──────────────────────────────────────────────────────
    upstream api_backend {
        least_conn;
        server 127.0.0.1:4000 weight=5;
        keepalive 32;
    }

    upstream web_marketing {
        server 127.0.0.1:3000;
        keepalive 8;
    }

    upstream admin_portal {
        least_conn;
        server 127.0.0.1:3001 weight=3;
        keepalive 8;
    }

    upstream teacher_portal {
        least_conn;
        server 127.0.0.1:3002 weight=3;
        keepalive 8;
    }

    upstream student_portal {
        least_conn;
        server 127.0.0.1:3003 weight=3;
        keepalive 8;
    }

    upstream parent_portal {
        least_conn;
        server 127.0.0.1:3004 weight=3;
        keepalive 8;
    }

    # ── Proxy settings macro ───────────────────────────────────────────
    proxy_http_version      1.1;
    proxy_set_header        Upgrade         $http_upgrade;
    proxy_set_header        Connection      "upgrade";
    proxy_set_header        Host            $host;
    proxy_set_header        X-Real-IP       $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_cache_bypass      $http_upgrade;
    proxy_read_timeout      90s;
    proxy_connect_timeout   10s;

    # ══════════════════════════════════════════════════════════════════
    # HTTP → HTTPS redirect (all hosts)
    # ══════════════════════════════════════════════════════════════════
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ══════════════════════════════════════════════════════════════════
    # ADMIN PORTAL  →  admin.myschool.pk
    # ══════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name admin.myschool.pk;

        ssl_certificate     /etc/ssl/myschool/fullchain.pem;
        ssl_certificate_key /etc/ssl/myschool/privkey.pem;

        add_header X-Portal "Admin Dashboard" always;

        # Login rate limiting
        location /login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://admin_portal;
        }

        # Static assets – cache aggressively
        location /_next/static/ {
            proxy_pass http://admin_portal;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            limit_req zone=general burst=30 nodelay;
            proxy_pass http://admin_portal;
        }
    }

    # ══════════════════════════════════════════════════════════════════
    # TEACHER PORTAL  →  teach.myschool.pk
    # ══════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name teach.myschool.pk;

        ssl_certificate     /etc/ssl/myschool/fullchain.pem;
        ssl_certificate_key /etc/ssl/myschool/privkey.pem;

        add_header X-Portal "Teacher Portal" always;

        location /login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://teacher_portal;
        }

        location /_next/static/ {
            proxy_pass http://teacher_portal;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            limit_req zone=general burst=30 nodelay;
            proxy_pass http://teacher_portal;
        }
    }

    # ══════════════════════════════════════════════════════════════════
    # STUDENT PORTAL  →  learn.myschool.pk
    # ══════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name learn.myschool.pk;

        ssl_certificate     /etc/ssl/myschool/fullchain.pem;
        ssl_certificate_key /etc/ssl/myschool/privkey.pem;

        add_header X-Portal "Student Portal" always;

        location /login {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://student_portal;
        }

        location /_next/static/ {
            proxy_pass http://student_portal;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            limit_req zone=general burst=60 nodelay;
            proxy_pass http://student_portal;
        }
    }

    # ══════════════════════════════════════════════════════════════════
    # PARENT PORTAL  →  parent.myschool.pk
    # ══════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name parent.myschool.pk;

        ssl_certificate     /etc/ssl/myschool/fullchain.pem;
        ssl_certificate_key /etc/ssl/myschool/privkey.pem;

        add_header X-Portal "Parent Portal" always;

        location /login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://parent_portal;
        }

        location /_next/static/ {
            proxy_pass http://parent_portal;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            limit_req zone=general burst=30 nodelay;
            proxy_pass http://parent_portal;
        }
    }

    # ══════════════════════════════════════════════════════════════════
    # API  →  api.myschool.pk
    # ══════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name api.myschool.pk;

        ssl_certificate     /etc/ssl/myschool/fullchain.pem;
        ssl_certificate_key /etc/ssl/myschool/privkey.pem;

        add_header X-Service "EduOS API" always;

        # CORS preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, x-tenant-id" always;
            add_header Access-Control-Max-Age 3600;
            return 204;
        }

        location /api/v1/auth/login {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://api_backend;
        }

        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://api_backend;
        }

        # WebSocket support
        location /socket.io/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 86400s;
        }
    }

    # ══════════════════════════════════════════════════════════════════
    # MARKETING WEBSITE  →  myschool.pk  &  www.myschool.pk
    # Also: {slug}.myschool.pk for per-school landing pages
    # ══════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name myschool.pk www.myschool.pk *.myschool.pk;

        ssl_certificate     /etc/ssl/myschool/wildcard_fullchain.pem;
        ssl_certificate_key /etc/ssl/myschool/wildcard_privkey.pem;

        location /_next/static/ {
            proxy_pass http://web_marketing;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            limit_req zone=general burst=60 nodelay;
            proxy_pass http://web_marketing;
        }
    }
}
