apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: monitoring
data:
  alerts.yml: |
    groups:
      - name: myschoolapp.critical
        rules:
          - alert: APIDown
            expr: up{job="myschoolapp-api"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "API pod is down"
              description: "MySchool App API has been down for more than 1 minute"

          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "High error rate > 5%"

          - alert: HighResponseTime
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.5
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "p95 response time > 500ms"

          - alert: DatabaseConnectionsHigh
            expr: pg_stat_activity_count > 80
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "PostgreSQL connections > 80"

          - alert: RedisMemoryHigh
            expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Redis memory > 85%"

          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} is crash looping"

          - alert: KafkaConsumerLag
            expr: kafka_consumergroup_lag > 1000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Kafka consumer lag > 1000 messages"
