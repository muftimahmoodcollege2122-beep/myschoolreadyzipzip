apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-api-slo
  namespace: monitoring
data:
  api-slo.json: |
    {
      "title": "School SaaS - API SLOs",
      "timezone": "browser",
      "refresh": "30s",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1, "title": "Request rate (by route)", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [{ "expr": "sum(rate(http_requests_total{job=\"myschoolapp-api\"}[5m])) by (route)", "legendFormat": "{{route}}" }]
        },
        {
          "id": 2, "title": "Error rate (5xx, target < 1%)", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [{ "expr": "sum(rate(http_requests_total{job=\"myschoolapp-api\",status=~\"5..\"}[5m])) / sum(rate(http_requests_total{job=\"myschoolapp-api\"}[5m]))", "legendFormat": "error rate" }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.01 }] } } }
        },
        {
          "id": 3, "title": "Latency p95 (target < 300ms)", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"myschoolapp-api\"}[5m])) by (le))", "legendFormat": "p95" }],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 4, "title": "Requests in-flight pods", "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [{ "expr": "count(up{job=\"myschoolapp-api\"} == 1)" }]
        },
        {
          "id": 5, "title": "Node.js process memory (RSS)", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [{ "expr": "nodejs_process_resident_memory_bytes{job=\"myschoolapp-api\"}", "legendFormat": "{{pod}}" }],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 6, "title": "Event loop lag (p99)", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [{ "expr": "nodejs_nodejs_eventloop_lag_p99_seconds{job=\"myschoolapp-api\"}", "legendFormat": "{{pod}}" }]
        }
      ]
    }
