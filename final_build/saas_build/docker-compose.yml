version: '3.9'

# =============================================================================
#  EduOS Multi-Portal Docker Compose
#  Services: postgres, redis, api, web, admin, teacher, student, parent, nginx
# =============================================================================

networks:
  eduos_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nginx_certs:
  app_logs:

x-next-common: &next-common
  restart: unless-stopped
  networks:
    - eduos_net
  environment: &next-env
    NODE_ENV: production
    TZ: Asia/Karachi
    NEXT_PUBLIC_API_URL: ${API_URL:-https://api.myschool.pk}
  depends_on:
    api:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: eduos_postgres
    restart: unless-stopped
    networks:
      - eduos_net
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-eduos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB:       ${POSTGRES_DB:-eduos}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduos} -d ${POSTGRES_DB:-eduos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eduos_redis
    restart: unless-stopped
    networks:
      - eduos_net
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS API  (port 4000) ───────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: eduos_api
    restart: unless-stopped
    networks:
      - eduos_net
    environment:
      NODE_ENV: production
      PORT: 4000
      TZ: Asia/Karachi
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL:    ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET:   ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRY:   ${JWT_EXPIRY:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://admin.myschool.pk,https://teach.myschool.pk,https://learn.myschool.pk,https://parent.myschool.pk}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  # ── Marketing Website  (port 3000) ────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: eduos_web
    <<: *next-common
    environment:
      <<: *next-env
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"

  # ── Admin Dashboard  (port 3001) ──────────────────────────────────────────
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: eduos_admin
    <<: *next-common
    environment:
      <<: *next-env
      PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"

  # ── Teacher Portal  (port 3002) ───────────────────────────────────────────
  teacher:
    build:
      context: ./apps/teacher
      dockerfile: Dockerfile
    container_name: eduos_teacher
    <<: *next-common
    environment:
      <<: *next-env
      PORT: 3002
    ports:
      - "127.0.0.1:3002:3002"

  # ── Student Portal  (port 3003) ───────────────────────────────────────────
  student:
    build:
      context: ./apps/student
      dockerfile: Dockerfile
    container_name: eduos_student
    <<: *next-common
    environment:
      <<: *next-env
      PORT: 3003
    ports:
      - "127.0.0.1:3003:3003"

  # ── Parent Portal  (port 3004) ────────────────────────────────────────────
  parent:
    build:
      context: ./apps/parent
      dockerfile: Dockerfile
    container_name: eduos_parent
    <<: *next-common
    environment:
      <<: *next-env
      PORT: 3004
    ports:
      - "127.0.0.1:3004:3004"

  # ── Nginx Reverse Proxy  (ports 80 & 443) ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: eduos_nginx
    restart: unless-stopped
    networks:
      - eduos_net
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/ssl/myschool:ro
      - app_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - admin
      - teacher
      - student
      - parent
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
